<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Docs</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #16213e;
            padding: 20px;
            border-right: 1px solid #0f3460;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h1 {
            color: #00d4aa;
            font-size: 1.3em;
            margin-bottom: 5px;
        }
        .sidebar .subtitle {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 20px;
        }
        .sidebar h2 {
            color: #e94560;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px;
            padding-top: 10px;
            border-top: 1px solid #0f3460;
        }
        .sidebar a {
            display: block;
            color: #ccc;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 2px 0;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .sidebar a:hover {
            background: #0f3460;
            color: #00d4aa;
        }
        .sidebar a.active {
            background: #00d4aa;
            color: #1a1a2e;
            font-weight: bold;
        }
        .sidebar a.external::after {
            content: " ↗";
            font-size: 0.8em;
            opacity: 0.6;
        }
        .content {
            margin-left: 280px;
            padding: 40px;
            max-width: 900px;
        }
        .content h1 { color: #00d4aa; margin-bottom: 20px; }
        .content h2 { color: #e94560; margin: 30px 0 15px; padding-bottom: 10px; border-bottom: 1px solid #0f3460; }
        .content h3 { color: #00d4aa; margin: 25px 0 10px; }
        .content p { margin: 15px 0; }
        .content pre {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 15px 0;
        }
        .content code {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .content pre code { background: none; padding: 0; }
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .content th, .content td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        .content th { color: #00d4aa; font-weight: 600; }
        .content blockquote {
            border-left: 4px solid #00d4aa;
            padding-left: 15px;
            margin: 15px 0;
            color: #aaa;
        }
        .content ul, .content ol { margin: 15px 0; padding-left: 30px; }
        .content li { margin: 5px 0; }
        .content a { color: #00d4aa; }
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        .error {
            background: #2d132c;
            border-left: 4px solid #e94560;
            padding: 20px;
            margin: 20px 0;
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .content { margin-left: 0; }
            .layout { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <h1>Minecraft Server</h1>
            <div class="subtitle">Proxmox LXC Docs</div>

            <h2>Dashboard</h2>
            <a href="index.html" class="nav-link">Overview</a>
            <a href="https://rifaterdemsahin.github.io/minecraft/" class="nav-link external" target="_blank">Live Site</a>

            <h2>Guides</h2>
            <a href="?doc=README.md" class="nav-link">Quick Start</a>
            <a href="?doc=NEXT-START.md" class="nav-link">Turn On Next Time</a>
            <a href="?doc=AGENTS.md" class="nav-link">Architecture (AGENTS)</a>

            <h2>Troubleshooting</h2>
            <a href="?doc=FORMULA.md" class="nav-link">Formula</a>
            <a href="?doc=RESOLUTION.md" class="nav-link">Missing Tools Fix</a>
            <a href="?doc=RESOLUTION-PAPER-VERSION.md" class="nav-link">Paper Version Fix</a>
            <a href="?doc=RESOLUTION-SERVER-STARTED.md" class="nav-link">Startup Success</a>

            <h2>Scripts</h2>
            <a href="https://github.com/rifaterdemsahin/minecraft/tree/main/scripts" class="nav-link external" target="_blank">GitHub Scripts ↗</a>

            <h2>External</h2>
            <a href="https://github.com/rifaterdemsahin/minecraft" class="nav-link external" target="_blank">GitHub Repo ↗</a>
            <a href="https://docs.papermc.io/" class="nav-link external" target="_blank">Paper Docs ↗</a>
        </nav>

        <main class="content" id="content">
            <div class="loading">Loading documentation...</div>
        </main>
    </div>

    <script>
        const DOCS = [
            'README.md', 'AGENTS.md', 'FORMULA.md', 'NEXT-START.md',
            'RESOLUTION.md', 'RESOLUTION-PAPER-VERSION.md', 'RESOLUTION-SERVER-STARTED.md'
        ];

        async function loadDoc(filename) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading ' + filename + '...</div>';

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Failed to load ' + filename);
                const text = await response.text();
                content.innerHTML = marked.parse(text);
            } catch (err) {
                content.innerHTML = '<div class="error"><h3>Error loading ' + filename + '</h3><p>' + err.message + '</p></div>';
            }
        }

        function updateActiveLink() {
            const params = new URLSearchParams(window.location.search);
            const doc = params.get('doc') || 'README.md';
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '?doc=' + doc || (doc === 'README.md' && link.getAttribute('href') === 'index.html')) {
                    link.classList.add('active');
                }
            });
        }

        // Handle navigation
        const params = new URLSearchParams(window.location.search);
        const doc = params.get('doc') || 'README.md';

        if (DOCS.includes(doc)) {
            loadDoc(doc);
        } else {
            document.getElementById('content').innerHTML = '<div class="error"><h3>Document not found</h3><p>Select a document from the menu.</p></div>';
        }

        updateActiveLink();

        // Handle browser back/forward
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const doc = params.get('doc') || 'README.md';
            if (DOCS.includes(doc)) loadDoc(doc);
            updateActiveLink();
        });
    </script>
</body>
</html>
